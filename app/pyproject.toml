[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "celery>=5.6.3",
    "django>=6.0.3",
    "django-celery-beat>=2.9.0",
    "django-environ>=0.13.0",
    "django-htmx>=1.27.0",
    "psycopg[binary]>=3.3.3",
    "redis>=7.4.0",
    "requests>=2.33.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "djlint>=1.50.0",
]
prod = [
    "gunicorn>=26.0.0",
]

[tool.djls]
django_settings_module = "config.settings"

[tool.djlint]
profile = "django"
